name: lrc
description: A Dart-only package that creates, parses, and handles LRC, which is a format that stores song lyrics.
version: 1.7.1
repository: https://github.com/Yivan000/lrc

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  html_unescape: ^2.0.0
  xml: ^6.6.1
  charset: ^2.0.1
  kana_kit: ^2.1.1

dev_dependencies:
  pedantic: ^1.10.0
  test: ^1.16.0
